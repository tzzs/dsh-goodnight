name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch; the latest commit is what matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin only implements a Windows power backend, but the state
        # machine and the browser half are platform independent. Running the
        # suite on all three catches the platform assumptions that would
        # otherwise only surface on a user's machine.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The suite has no dependencies, so there is nothing to install. No
      # `npm ci` either: the repository ships without a lockfile, and a plugin
      # that must be installed with npm should not need a build step to be
      # verified.
      - name: Run the test suite
        run: npm test
