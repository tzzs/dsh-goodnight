<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-goodnight · background presets</title>
<style>
  /* One screenshot of the two translucent presets, for the README. The opaque
     preset is already the hero screenshot; each cell is an iframe so the
     preview's own tokens and layout stay isolated. */
  html, body { margin: 0; background: #d9dce2; }
  body { display: flex; gap: 10px; padding: 10px; }
  iframe { display: block; width: 900px; height: 560px; border: 0; }
</style>
</head>
<body>
<iframe src="preview.html?bg=glass" title="glass"></iframe>
<iframe src="preview.html?bg=blur" title="blur"></iframe>
</body>
</html>
