  const Page = registered.get('goodnight');
  const Countdown = registered.get('dsh-goodnight.countdown');
  const PreviewOverlay = registered.get('dsh-goodnight.preview');
  const WaitOverlay = registered.get('dsh-goodnight.wait');
  // The DSH theme injects this globally; without it a 50% radius renders as a
  // circle here and as a squircle inside the app, so the docs would lie about
  // the shape. ?squircle=0 turns it off again for comparison.
  if (params.get('squircle') !== '0') {
    const shapeStyle = document.createElement('style');
    shapeStyle.textContent = '@supports (corner-shape:superellipse(1.5)){:root{--dsw-corner-shape:superellipse(1.5)}*,:before,:after{corner-shape:var(--dsw-corner-shape)}}';
    document.head.appendChild(shapeStyle);
  }

  const root = document.getElementById('overlay-root');
  // The page is a main-pane view: the app gives it a sized column, and so does
  // this preview, otherwise height:100% would collapse to nothing.
  root.style.cssText = 'position:fixed;inset:0;display:flex;z-index:1';
  function render() {
    const node = React.createElement('div', { key: resetGeneration, style: { display: 'flex', width: '100%', height: '100%' } },
      React.createElement(Page, { ...pageProps, key: 'page' }),
      React.createElement(Countdown, { usePower, t, cancel, key: 'countdown' }),
      WaitOverlay !== undefined ? React.createElement(WaitOverlay, {
        usePower,
        cancel,
        force,
        dismiss,
        t,
        key: 'wait',
      }) : null,
      PreviewOverlay !== undefined ? React.createElement(PreviewOverlay, {
        usePower,
        close: closePreview,
        t,
        key: 'preview',
      }) : null,
    );
    const previous = tree;
    tree = patch(root, tree, node, false);
    if (!previous) root.appendChild(tree.dom);
    // The page is a main-pane view, so the stand-in app behind it must go.
    document.querySelector('.fake-app').style.display = pageMode ? 'none' : '';
    if (status.textContent !== demoStatus) status.textContent = demoStatus;
    flushEffects();
  }

  if (live) {
    controls.hidden = false;
    document.getElementById('preview-start').addEventListener('click', () => { void startCountdown(); });
    document.getElementById('preview-reset').addEventListener('click', () => {
      stopTimer();
      state = initialState();
      resetGeneration += 1; // Explicit reset also clears component-local choices.
      demoStatus = '已恢复 URL 中的初始设置。安全演示，不执行电源命令。';
      if (state.data.phase === 'counting') { state.data.deadline = Date.now() + initialSeconds * 1000; driveCountdown(); }
      scheduleRender();
    });
    window.addEventListener('resize', scheduleRender);
  }
  // A plain URL renders the countdown itself (that is what the docs image needs),
  // so the ticking must not depend on the demo controls being on screen.
  if (state.data.phase === 'counting') {
    state.data.deadline = Date.now() + initialSeconds * 1000;
    demoStatus = '安全倒计时演示中；到 0 秒自动停止，不执行电源命令。';
    driveCountdown();
  }
  window.addEventListener('pagehide', (event) => {
    if (event.persisted) return;
    alive = false;
    stopTimer();
    dispose(tree);
    flushEffects();
    hostCleanups.forEach((cleanup) => cleanup());
    window.removeEventListener('resize', scheduleRender);
  });
  render();
})();
</script>
</body>
</html>
