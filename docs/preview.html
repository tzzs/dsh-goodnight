<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-idle-power · countdown preview</title>
<style>
  /* Stand-ins for the DSH design tokens, so the plugin CSS resolves the same way. */
  :root {
    --dsw-alias-bg-mask-3: rgba(16, 19, 26, .66);
    --dsw-alias-bg-overlay: #f1f2f5;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-label-primary: #191c22;
    --dsw-alias-label-secondary: #585f70;
    --dsw-alias-label-tertiary: #79808e;
    --dsw-alias-label-primary-foreground: #ffffff;
    --dsw-alias-border-l1: rgba(18, 21, 28, .10);
    --dsw-alias-border-l2: rgba(18, 21, 28, .17);
    --dsw-alias-border-l3: rgba(18, 21, 28, .26);
    --dsw-alias-brand-primary: #2f66f5;
    --dsw-alias-state-error-primary: #d93a40;
    --dsw-alias-interactive-bg-hover: rgba(18, 21, 28, .06);
    --dsw-focus-ring-width: 2px;
    --dsw-focus-ring-color: #2f66f5;
    --dsw-radius-xs: 4px;
    --dsw-radius-sm: 8px;
    --dsw-radius-md: 12px;
    --dsw-radius-panel: 18px;
    --dsw-elevation-soft: 0 2px 10px rgba(0, 0, 0, .10);
    --dsw-elevation-prominent: 0 18px 54px rgba(0, 0, 0, .20);
  }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
  /* A muted stand-in for the app behind the scrim, so the blur reads honestly. */
  .fake-app { position: fixed; inset: 0; background: #e9ebef; color: #2a2e37; overflow: hidden; }
  .fake-app .titlebar { height: 38px; background: #f7f8fa; border-bottom: 1px solid #d9dce2; }
  .fake-app .rail { position: absolute; left: 0; top: 38px; bottom: 0; width: 248px; background: #dfe3ea; border-right: 1px solid #c8cfda; }
  .fake-app .rail .row { height: 34px; margin: 14px 18px; border-radius: 7px; background: #b9c2d0; }
  .fake-app .rail .row:nth-child(2) { width: 72%; }
  .fake-app .rail .row:nth-child(4) { width: 88%; }
  .fake-app .rail .row:nth-child(5) { width: 60%; }
  .fake-app .content { position: absolute; left: 290px; right: 60px; top: 80px; }
  .fake-app .content h1 { font-size: 30px; margin: 0 0 28px; color: #2a3040; }
  .fake-app .content .line { height: 15px; border-radius: 6px; background: #aeb7c6; margin: 16px 0; }
  .fake-app .content .line:nth-child(3) { width: 82%; }
  .fake-app .content .line:nth-child(5) { width: 64%; }
  .fake-app .content .line:nth-child(7) { width: 91%; }
  .fake-app .content .line:nth-child(9) { width: 47%; }
  /* A few saturated surfaces so a frosted/blurred overlay has something real
     to soften; the actual Harness UI has far more contrast than grey lines. */
  .fake-app .tile { position: absolute; border-radius: 12px; }
  .fake-app .tile.a { left: 290px; top: 430px; width: 300px; height: 150px; background: #4d7cf3; }
  .fake-app .tile.b { left: 620px; top: 430px; width: 300px; height: 150px; background: #e8934a; }
  .fake-app .tile.c { left: 950px; top: 430px; width: 300px; height: 150px; background: #3fa88f; }
  .fake-app .tile.d { left: 290px; top: 620px; width: 620px; height: 110px; background: #8a6bd8; }
</style>
</head>
<body>
<div class="fake-app" aria-hidden="true">
  <div class="titlebar"></div>
  <div class="rail"><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div></div>
  <div class="content">
    <h1>会话 · 空闲后休眠或关机</h1>
    <div class="line"></div><div class="line"></div><div class="line"></div>
    <div class="line"></div><div class="line"></div><div class="line"></div>
  </div>
  <div class="tile a"></div><div class="tile b"></div><div class="tile c"></div><div class="tile d"></div>
</div>
<div id="overlay-root"></div>

<script>
  // A tiny React stand-in: one render pass is enough for a static design review,
  // but it renders the REAL component and the REAL stylesheet from client.js.
  let captured = null;
  window.__ModuleLoader__ = { load(entry) { captured = entry.factory; } };
  if (new URLSearchParams(location.search).has('multi')) {
    try { Object.defineProperty(window.screen, 'isExtended', { value: true, configurable: true }); } catch (e) {}
  }
  // ?dark=1 swaps in dark-theme token values, so the same overlay can be checked
  // in the theme it will actually ship in.
  if (new URLSearchParams(location.search).has('dark')) {
    var dark = {
      '--dsw-alias-bg-overlay': '#1b1e25', '--dsw-alias-bg-layer-1': '#23262e', '--dsw-alias-bg-layer-2': '#2a2e38',
      '--dsw-alias-label-primary': '#f2f4f8', '--dsw-alias-label-secondary': '#a9b1c0', '--dsw-alias-label-tertiary': '#828b9b',
      '--dsw-alias-border-l1': 'rgba(255,255,255,.10)', '--dsw-alias-border-l2': 'rgba(255,255,255,.18)',
      '--dsw-alias-border-l3': 'rgba(255,255,255,.28)', '--dsw-alias-brand-primary': '#6f9bff',
      '--dsw-alias-state-error-primary': '#ff6b6b', '--dsw-alias-interactive-bg-hover': 'rgba(255,255,255,.08)'
    };
    for (var key in dark) document.documentElement.style.setProperty(key, dark[key]);
  }
</script>
<script src="../client.js"></script>
<script>
(function () {
  let cursor = 0;
  let slots = [];
  function beginComponent() { cursor = 0; slots = []; }

  const React = {
    createElement(type, props) {
      const children = Array.prototype.slice.call(arguments, 2).flat(Infinity)
        .filter((c) => c !== undefined && c !== null && c !== false && c !== true);
      return { type: type, props: props || {}, children: children };
    },
    useState(init) {
      const i = cursor++;
      if (!(i in slots)) slots[i] = typeof init === 'function' ? init() : init;
      return [slots[i], (next) => { slots[i] = typeof next === 'function' ? next(slots[i]) : next; }];
    },
    useEffect(fn) { cursor++; const cleanup = fn(); return typeof cleanup === 'function' ? cleanup : undefined; },
    useCallback(fn) { cursor++; return fn; },
    useMemo(fn) { cursor++; return fn(); },
    useRef(v) { cursor++; return { current: v }; },
  };

  const SVG = { svg: 1, circle: 1, path: 1 };
  function mount(node) {
    if (node === null || node === undefined) return null;
    if (typeof node === 'string' || typeof node === 'number') return document.createTextNode(String(node));
    if (Array.isArray(node)) {
      const frag = document.createDocumentFragment();
      node.forEach((child) => { const el = mount(child); if (el) frag.appendChild(el); });
      return frag;
    }
    if (typeof node.type === 'function') {
      beginComponent();
      return mount(node.type(Object.assign({}, node.props, { children: node.children })));
    }
    const el = SVG[node.type]
      ? document.createElementNS('http://www.w3.org/2000/svg', node.type)
      : document.createElement(node.type);
    Object.keys(node.props).forEach((key) => {
      const value = node.props[key];
      if (value === undefined || value === null || key === 'key') return;
      if (key === 'className') el.setAttribute('class', value);
      else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value);
      else if (key === 'ref') { if (value && typeof value === 'object') value.current = el; }
      else if (key === 'autoFocus') { /* no focus ring in a static preview */ }
      else if (key.slice(0, 2) === 'on' && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value);
      // React renders aria-*/data-* booleans as "true"/"false" strings, which is
      // what attribute selectors such as [aria-pressed=true] match against.
      else if (key.slice(0, 5) === 'aria-' || key.slice(0, 5) === 'data-') el.setAttribute(key, String(value));
      else if (value === false) return;
      else el.setAttribute(key, value === true ? '' : String(value));
    });
    node.children.forEach((child) => { const el2 = mount(child); if (el2) el.appendChild(el2); });
    return el;
  }

  const zh = {
    'countdown.title': '所有任务已完成',
    'countdown.hibernate': '将进入休眠',
    'countdown.shutdown': '将关机',
    'countdown.suffix': '秒',
    'countdown.cancel': '取消',
    'countdown.cancelling': '正在取消…',
    'countdown.hint': '有任何新任务开始，倒计时会自动作废。',
    'countdown.quietDone': '已通过 %s 秒持续空闲',
    'countdown.scheduledAt': '预计 %s 执行（本机时间）',
    'countdown.window': '倒计时窗口 %s 秒',
    'countdown.remaining': '剩余 %s 秒',
    'countdown.progress': '倒计时进度',
    'countdown.scopeTag': '仅覆盖当前 Harness 窗口',
    'countdown.multiNote': '检测到多块屏幕：倒计时只会出现在 Harness 窗口所在的屏幕。若窗口跨了两块屏，可把计时器固定在其中一侧。',
    'countdown.alignLabel': '计时器位置',
    'countdown.alignLeft': '靠左',
    'countdown.alignCenter': '居中',
    'countdown.alignRight': '靠右',
    'countdown.mirrors': '在其它屏幕也显示',
    'countdown.mirrorRetry': '重新显示',
    'countdown.mirrorWorking': '正在打开…',
    'countdown.mirrorsOn': '已在 %s 个附加窗口显示',
    'countdown.mirrorBlocked': '当前 Harness 窗口不允许弹出附加窗口，倒计时只在它所在的屏幕可见。',
    'countdown.mirrorPlain': '已打开一个镜像窗口，请把它拖到另一块屏幕。',
    'countdown.beaconTitle': '关机倒计时 · 镜像窗口',
    'countdown.beaconHint': '在任意窗口取消，都会停止本次电源操作。',
    'countdown.offline': '连接已断开，预约可能仍在执行。取消尚未确认，请重试。',
    'status.failed': '执行失败',
    'panel.scope': '关闭页面不会取消预约；不监测其他应用或其他 Host。',
    'panel.shutdownNote': '会强制关闭应用，未保存的内容可能丢失。请先保存其他应用的工作。',
    'panel.title': '空闲后休眠或关机',
    'panel.subtitle': '等待当前 DSH Host 的任务结束，再执行一次电源操作。',
    'panel.mode': '电源操作',
    'panel.background': '倒计时背景',
    'panel.hibernate': '休眠',
    'panel.hibernateDesc': '内存快照落盘，等于断电；下次开机原样恢复窗口和未保存的内容。',
    'panel.hibernateNote': '休眠后按电源键会把整机内存读回来，开着的窗口都还在。',
    'panel.shutdown': '关机',
    'panel.shutdownDesc': '倒计时结束后关闭 Windows，DSH 对话记录仍然保留。',
    'panel.flow': '执行流程',
    'panel.quiet': '秒持续空闲',
    'panel.countdown': '秒可取消倒计时',
    'panel.close': '关闭',
    'panel.arm': '预约',
    'status.idle': '未预约',
    'status.saving': '正在提交…',
    'background.solid': '纯色',
    'background.solidDesc': '不透明底色，文字对比度最高。',
    'background.glass': '毛玻璃',
    'background.glassDesc': '半透明 + 模糊，隐约透出背后的窗口。',
    'background.blur': '高斯模糊',
    'background.blurDesc': '重度模糊 + 暗底，沉浸式深色提示。',
  };
  const t = (key) => (key in zh ? zh[key] : key);

  const params = new URLSearchParams(location.search);
  const remaining = Number(params.get('s') || 47);
  const mode = params.get('mode') || 'hibernate';
  const backgroundStyle = params.get('bg') || 'solid';
  const panelMode = params.has('panel');
  const state = {
    data: {
      supported: true, platform: 'win32', phase: panelMode ? 'idle' : 'counting', mode: mode,
      backgroundStyle: backgroundStyle,
      countdownSeconds: 60, quietSeconds: 20,
      remainingSeconds: remaining, quietRemainingSeconds: 0, deadline: null,
      busy: { available: true, agentsRunning: 0, inboxPending: 0, jobsRunning: 0, total: 0 },
      error: null, lastExecution: null,
    },
    ready: true, offline: false, busy: false, note: null, noteCode: null, notePhase: null,
    panelOpen: panelMode, anchor: null,
  };
  const usePower = (selector) => (selector ? selector(state) : state);

  const registered = [];
  const ctx = {
    effect(fn) { fn(); return () => {}; },
    get: () => undefined,
    locale: { register: () => () => {}, bind: () => t },
    slots: {
      inject(name, callback) { callback(); return () => {}; },
      register(options, component) { registered.push({ id: options.id, component: component }); return () => {}; },
    },
  };

  const moduleObj = captured((spec) => spec === 'react' ? React : null);
  moduleObj.apply(ctx);
  const noop = async () => true;
  const entry = registered.find((r) => r.id === (panelMode ? 'dsh-idle-power.panel' : 'dsh-idle-power.countdown'));
  const root = panelMode
    ? entry.component({ usePower: usePower, t: t, arm: noop, cancel: noop, setMode: noop, setBackground: noop, close: () => {} })
    : entry.component({ usePower: usePower, t: t, cancel: noop });
  const el = mount(root);
  if (panelMode) {
    // Pin the popover to the top-left for a still screenshot; the live panel is
    // anchored above its sidebar trigger instead.
    const fake = document.querySelector('.fake-app');
    if (fake) fake.style.display = 'none';
    document.body.style.background = '#eef0f4';
    if (el) {
      el.style.left = '12px';
      el.style.top = '12px';
      el.style.bottom = 'auto';
      el.style.maxHeight = 'none';
    }
  }
  document.getElementById('overlay-root').appendChild(el);
})();
</script>
</body>
</html>
